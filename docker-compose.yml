  # Next.js 应用
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mooyu-web
    ports:
      - "3000:3000"
    environment:
      # 数据库配置（使用云数据库，通过环境变量配置）
      # 示例：DATABASE_URL=mysql://user:password@your-cloud-db-host:3306/database
      DATABASE_URL: ${DATABASE_URL}
      # 会话密钥（请修改为随机字符串）
      SESSION_SECRET: ${SESSION_SECRET:-mooyu-secret-change-this-to-random-32-chars-minimum}
      # Redis 配置（使用云 Redis，通过环境变量配置）
      # 示例：REDIS_URL=redis://:password@your-cloud-redis-host:6379
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Next.js 配置
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # 应用 URL（用于 Server Actions）
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # OSS 配置（根据实际情况填写）
      OSS_REGION: ${OSS_REGION:-oss-cn-hangzhou}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      # AI 配置
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openai}
      AI_ALLOWED_PROVIDERS: ${AI_ALLOWED_PROVIDERS:-openai,qwen}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-qwen}
      AI_MONTHLY_USER_CAP_CENTS: ${AI_MONTHLY_USER_CAP_CENTS:-500}
      AI_JOB_COST_LIMIT_CENTS: ${AI_JOB_COST_LIMIT_CENTS:-50}
      # 队列配置
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-1}
      # 文件配置
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
      ALLOWED_EXT: ${ALLOWED_EXT:-doc,docx,txt,md}
    restart: unless-stopped
    networks:
      - mooyu-network
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AI 任务队列 Worker
  worker:
    build:
      context: .
      dockerfile: worker/ai-queue/Dockerfile
    container_name: mooyu-worker
    environment:
      # 数据库配置（使用云数据库，通过环境变量配置）
      DATABASE_URL: ${DATABASE_URL}
      # Redis 配置（使用云 Redis，通过环境变量配置）
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # AI 配置
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openai}
      AI_ALLOWED_PROVIDERS: ${AI_ALLOWED_PROVIDERS:-openai,qwen}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-qwen}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-1}
      # 其他配置
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - mooyu-network

networks:
  mooyu-network:
    driver: bridge
