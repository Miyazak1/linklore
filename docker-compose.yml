services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: mooyu-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mooyu}
      MYSQL_USER: ${MYSQL_USER:-mooyu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fdn4jjKXGZ56LJLh}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fdn4jjKXGZ56LJLh}
    ports:
      - "3316:3306"  # 主机端口3316映射到容器端口3306
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: >
        sh -c "
        mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1
        "
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mooyu-network

  # Redis 缓存和队列
  redis:
    image: redis:7.2-alpine
    container_name: mooyu-redis
    ports:
      - "6379:6379"  # 主机端口6379映射到容器端口6379
    volumes:
      - redis-data:/data
    # 如果设置了 REDIS_PASSWORD，则使用密码；否则不使用密码
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"
      else
        redis-server --appendonly yes
      fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      # 健康检查：如果有密码则使用密码，否则直接 ping
      test: >
        sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-cli -a \"$$REDIS_PASSWORD\" ping
        else
          redis-cli ping
        fi
        "
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mooyu-network

  # Next.js 应用
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mooyu-web
    ports:
      - "3000:3000"
    environment:
      # 数据库配置
      DATABASE_URL: mysql://${MYSQL_USER:-mooyu}:${MYSQL_PASSWORD:-fdn4jjKXGZ56LJLh}@mysql:3306/${MYSQL_DATABASE:-mooyu}
      # 会话密钥（请修改为随机字符串）
      SESSION_SECRET: ${SESSION_SECRET:-mooyu-secret-change-this-to-random-32-chars-minimum}
      # Redis 配置
      # 如果 Redis 设置了密码，请设置 REDIS_URL 为: redis://:密码@redis:6379
      # 如果 Redis 没有密码，使用默认值: redis://redis:6379
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Next.js 配置
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # 应用 URL（用于 Server Actions）
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # OSS 配置（根据实际情况填写）
      OSS_REGION: ${OSS_REGION:-oss-cn-hangzhou}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      # AI 配置
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openai}
      AI_ALLOWED_PROVIDERS: ${AI_ALLOWED_PROVIDERS:-openai,qwen}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-qwen}
      AI_MONTHLY_USER_CAP_CENTS: ${AI_MONTHLY_USER_CAP_CENTS:-500}
      AI_JOB_COST_LIMIT_CENTS: ${AI_JOB_COST_LIMIT_CENTS:-50}
      # 队列配置
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-1}
      # 文件配置
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
      ALLOWED_EXT: ${ALLOWED_EXT:-doc,docx,txt,md}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mooyu-network
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AI 任务队列 Worker
  worker:
    build:
      context: .
      dockerfile: worker/ai-queue/Dockerfile
    container_name: mooyu-worker
    environment:
      # 数据库配置
      DATABASE_URL: mysql://${MYSQL_USER:-mooyu}:${MYSQL_PASSWORD:-fdn4jjKXGZ56LJLh}@mysql:3306/${MYSQL_DATABASE:-mooyu}
      # Redis 配置
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # AI 配置
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openai}
      AI_ALLOWED_PROVIDERS: ${AI_ALLOWED_PROVIDERS:-openai,qwen}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-qwen}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-1}
      # 其他配置
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mooyu-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  mooyu-network:
    driver: bridge
