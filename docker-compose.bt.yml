version: '3.8'

# 宝塔面板专用 Docker Compose 配置
# 使用方法: docker-compose -f docker-compose.yml -f docker-compose.bt.yml up -d

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: linklore-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linklore}
      POSTGRES_USER: ${POSTGRES_USER:-linklore_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATA: /var/lib/postgresql/data/pgdata
    # 不暴露端口到主机（仅 Docker 网络访问，更安全）
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linklore_user} -d ${POSTGRES_DB:-linklore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linklore-network
    # 资源限制（4核8GB服务器配置）
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis 缓存和队列
  redis:
    image: redis:7.2-alpine
    container_name: linklore-redis
    # 不暴露端口到主机（仅 Docker 网络访问，更安全）
    volumes:
      - redis-data:/data
    # 如果设置了 REDIS_PASSWORD，则使用密码；否则不使用密码
    command: >
      sh -c "
      if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"
      else
        redis-server --appendonly yes
      fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      # 健康检查：如果有密码则使用密码，否则直接 ping
      test: >
        sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-cli -a \"$$REDIS_PASSWORD\" ping
        else
          redis-cli ping
        fi
        "
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - linklore-network
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Next.js 应用
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linklore-web
    # 仅监听本地，通过 Nginx 反向代理访问
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # 数据库配置（使用 Docker 网络内的服务名）
      DATABASE_URL: postgresql://${POSTGRES_USER:-linklore_user}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-linklore}
      # 会话密钥（从 .env 文件读取）
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Redis 配置
      # 如果 Redis 设置了密码，请设置 REDIS_URL 为: redis://:密码@redis:6379
      # 如果 Redis 没有密码，使用默认值: redis://redis:6379
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Next.js 配置
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # 应用 URL（用于 Server Actions）
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # OSS 配置（从 .env 文件读取）
      OSS_REGION: ${OSS_REGION:-oss-cn-hangzhou}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      # AI 配置
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-openai}
      AI_ALLOWED_PROVIDERS: ${AI_ALLOWED_PROVIDERS:-openai,qwen}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-qwen}
      AI_MONTHLY_USER_CAP_CENTS: ${AI_MONTHLY_USER_CAP_CENTS:-500}
      AI_JOB_COST_LIMIT_CENTS: ${AI_JOB_COST_LIMIT_CENTS:-50}
      # 队列配置
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-1}
      # 文件配置
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
      ALLOWED_EXT: ${ALLOWED_EXT:-doc,docx,txt,md}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - linklore-network
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 资源限制（4核8GB服务器配置）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  linklore-network:
    driver: bridge

